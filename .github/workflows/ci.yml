name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env: { OFFLINE_MODE: "true", SIM_STEP_DELAY_MS: "0", HUMAN_APPROVAL_ENABLED: "false", CERT_DEMO_KEY: "ci-test-key" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python -m ruff check app tests
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
