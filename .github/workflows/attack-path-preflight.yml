name: Attack-path preflight
on:
  pull_request:
    paths:
      - "network/**"
jobs:
  preflight:
    runs-on: ubuntu-latest
    env: { CERT_DEMO_KEY: "ci-test-key", OFFLINE_MODE: "true" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: python scripts/preflight.py --offline --twin network/twin.json --change network/change.json --scenarios network/scenarios.json
