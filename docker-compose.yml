services:
  backend:
    build: ./backend
    environment:
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - MODEL_API_BASE_URL=${MODEL_API_BASE_URL:-https://api.meta.ai/v1}
      - META_MODEL=${META_MODEL:-muse-spark-1.3}
      - DATABASE_URL=sqlite:////data/cybergenesis.db
    volumes:
      - cyberdata:/data
      - ./scenarios:/scenarios:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  cyberdata:
